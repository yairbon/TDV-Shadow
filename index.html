<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23131722'/%3E%3Crect x='3' y='5' width='3' height='7' fill='%2326a69a'/%3E%3Crect x='10' y='3' width='3' height='9' fill='%23ef5350'/%3E%3C/svg%3E" />
    <title>TDV-Shadow</title>
    <style>
      /* Palette matches the canvas theme in src/renderer/theme.ts, so the chrome and the
         plot read as one surface rather than two apps stitched together. */
      :root {
        color-scheme: dark;
        --bg: #131722;
        --panel: #1e222d;
        --panel-hover: #2a2e39;
        --border: #2a2e39;
        --text: #d1d4dc;
        --text-dim: #787b86;
        --accent: #2962ff;
        --up: #26a69a;
        --down: #ef5350;
        --rail: 44px;
        --topbar: 42px;
      }
      /* Light theme: the canvas palette flips via src/renderer/theme.ts, so the chrome
         must flip with it or the page reads as two different applications. */
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f8f9fd;
        --panel-hover: #e9ecf2;
        --border: #d6dae0;
        --text: #131722;
        --text-dim: #6b7684;
        --up: #089981;
        --down: #f23645;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---------- top bar ---------- */
      #topbar {
        display: flex;
        align-items: center;
        gap: 2px;
        height: var(--topbar);
        flex: 0 0 var(--topbar);
        padding: 0 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        white-space: nowrap;
      }
      #topbar::-webkit-scrollbar {
        display: none;
      }
      .divider {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 6px;
        flex: 0 0 1px;
      }

      /* Every clickable in the bar shares one shape, the way a real toolbar does. */
      .tb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tb:hover {
        background: var(--panel-hover);
      }
      .tb[aria-pressed='true'] {
        background: var(--panel-hover);
        color: #fff;
      }
      .tb:focus-visible,
      .rail button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .tb svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #symbol-button {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.01em;
        padding-right: 10px;
      }
      #symbol-change {
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .tf {
        min-width: 30px;
        justify-content: center;
        padding: 0 7px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-dim);
      }
      .tf[aria-pressed='true'] {
        color: #fff;
      }
      select.tb {
        appearance: none;
        padding-right: 22px;
        background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
          linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
        background-position:
          calc(100% - 12px) 13px,
          calc(100% - 8px) 13px;
        background-size:
          4px 4px,
          4px 4px;
        background-repeat: no-repeat;
      }
      #symbol-input {
        width: 74px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        text-transform: uppercase;
      }
      #symbol-input::placeholder {
        color: var(--text-dim);
        text-transform: none;
      }
      .spacer {
        margin-left: auto;
      }
      #status {
        color: var(--text-dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        padding: 0 8px;
        /* The toolbar scrolls horizontally once its controls exceed the window, and the
           status is the last item in it — so at any width under ~1650px it sat past the
           right edge and was clipped mid-word ("2 drawin"). Sticking it to the
           scrollport's right edge keeps it readable while the controls behind it still
           scroll. `flex: 0 0 auto` because it must never be the thing that shrinks. */
        position: sticky;
        right: 0;
        flex: 0 0 auto;
        background: var(--panel);
        box-shadow: -10px 0 10px -6px var(--panel);
      }

      /* ---------- body: left rail + chart ---------- */
      #body {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: var(--rail);
        flex: 0 0 var(--rail);
        padding: 6px 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        scrollbar-width: none;
      }
      .rail::-webkit-scrollbar {
        display: none;
      }
      .rail button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        margin: 0 auto;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
      }
      .rail button:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      .rail button[aria-pressed='true'] {
        background: var(--accent);
        color: #fff;
      }
      .rail svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rail .sep {
        height: 1px;
        background: var(--border);
        margin: 4px 8px;
      }

      #chart-wrap {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
      }

      /* Legend text over the plot is explicitly allowed chrome (root mandate #1); the
         candles themselves remain canvas-only. */
      /* top/left are set from JS so the legend sits over the ACTIVE pane; these are the
         single-pane defaults, used before the first layout pass. */
      #legend {
        position: absolute;
        top: 8px;
        left: 12px;
        z-index: 20;
        pointer-events: none;
        font-size: 12px;
        line-height: 1.6;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #legend .title {
        font-weight: 600;
        font-size: 13px;
        color: var(--text);
      }
      #legend .muted {
        color: var(--text-dim);
        font-weight: 400;
      }
      #legend .ohlc {
        font-variant-numeric: tabular-nums;
        color: var(--text-dim);
      }
      #legend .ohlc b {
        font-weight: 600;
      }
      #legend .ind {
        font-variant-numeric: tabular-nums;
        color: var(--text-dim);
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }

      /* ---------- jump to latest ---------- */
      #jump {
        position: absolute;
        right: 78px;
        bottom: 40px;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #jump:hover {
        background: var(--panel-hover);
      }
      #jump[hidden] {
        display: none;
      }
      #jump svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- symbol search ---------- */
      #search {
        width: min(520px, 92vw);
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      }
      #search::backdrop {
        background: rgba(0, 0, 0, 0.55);
      }
      .search-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .search-head svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--text-dim);
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      #search-input {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        outline: none;
        text-transform: uppercase;
      }
      #search-input::placeholder {
        color: var(--text-dim);
        text-transform: none;
      }
      kbd {
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text-dim);
        font: inherit;
        font-size: 11px;
      }
      #search-results {
        margin: 0;
        padding: 6px;
        list-style: none;
        max-height: 320px;
        overflow-y: auto;
      }
      #search-results li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      #search-results li[aria-selected='true'] {
        background: var(--panel-hover);
      }
      #search-results .tk {
        font-weight: 700;
        min-width: 62px;
      }
      #search-results .nm {
        color: var(--text-dim);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #search-results .src {
        font-size: 11px;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
      }
      .search-foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 14px;
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 11px;
      }

      /* ---------- legend rows ---------- */
      #legend .row {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }
      #legend .row button {
        border: 0;
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
        padding: 0 2px;
        font-size: 13px;
        line-height: 1;
        opacity: 0;
      }
      #legend .row:hover button {
        opacity: 1;
      }
      #legend .row button:hover {
        color: var(--down);
      }

      /* ---------- settings sheets ---------- */
      dialog.sheet {
        width: min(400px, 92vw);
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 24px 64px rgb(0 0 0 / 60%);
      }
      dialog.sheet::backdrop {
        background: rgb(0 0 0 / 45%);
      }
      dialog.sheet h2 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }
      dialog.sheet h3 {
        margin: 16px 0 8px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }
      dialog.sheet .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      dialog.sheet label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--text-dim);
      }
      dialog.sheet input,
      dialog.sheet select {
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      dialog.sheet input[type='color'] {
        width: 34px;
        padding: 2px;
        cursor: pointer;
      }
      dialog.sheet input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      dialog.sheet .style-row {
        display: grid;
        grid-template-columns: 1fr 34px 64px 96px;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      dialog.sheet .style-row .nm {
        font-size: 12px;
      }
      dialog.sheet .row-end {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      dialog.sheet .tb.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      /* ---------- panes ---------- */
      #panes {
        position: absolute;
        inset: 0;
        display: grid;
        gap: 1px;
        background: var(--border);
      }
      #panes[data-layout='1'] {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      #panes[data-layout='2h'] {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr;
      }
      #panes[data-layout='2v'] {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      #panes[data-layout='4'] {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .pane {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Only shown when there is more than one pane: with a single chart an "active"
         outline is noise, since nothing else could be active. */
      #panes[data-layout='1'] .pane.active::after {
        display: none;
      }
      .pane.active::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 25;
        pointer-events: none;
        border: 1px solid var(--accent);
      }
      /* ---------- replay ---------- */
      #replay {
        position: absolute;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        z-index: 35;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgb(0 0 0 / 45%);
      }
      #replay[hidden] {
        display: none;
      }
      #replay .tb {
        height: 26px;
        padding: 0 8px;
      }
      #replay-scrub {
        width: 220px;
        accent-color: var(--accent);
      }
      #replay-at {
        min-width: 120px;
        color: var(--text-dim);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 820px), (pointer: coarse) {
        #replay {
          bottom: 56px;
        }
        #replay-scrub {
          width: 110px;
        }
        #replay-at {
          display: none;
        }
      }

      /* ---------- toasts ---------- */
      #toasts {
        position: absolute;
        top: 12px;
        right: 88px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }
      .toast {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--up);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
        box-shadow: 0 6px 18px rgb(0 0 0 / 40%);
      }

      /* ---------- context menu ---------- */
      .ctx {
        position: fixed;
        z-index: 60;
        min-width: 208px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgb(0 0 0 / 45%);
        user-select: none;
      }
      .ctx[hidden] {
        display: none;
      }
      .ctx .row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .ctx .row:hover:not(:disabled),
      .ctx .row:focus-visible {
        background: var(--panel-hover);
        outline: none;
      }
      .ctx .row:disabled {
        color: var(--text-dim);
        cursor: default;
      }
      .ctx .row.danger:hover:not(:disabled) {
        color: var(--down);
      }
      .ctx .tick {
        flex: 0 0 12px;
        color: var(--accent);
        font-size: 11px;
      }
      .ctx .label {
        flex: 1 1 auto;
      }
      .ctx .caret {
        flex: 0 0 auto;
        color: var(--text-dim);
      }
      .ctx .sep {
        height: 1px;
        margin: 4px 6px;
        background: var(--border);
      }

      /* ---------- phones ---------- */
      @media (max-width: 820px), (pointer: coarse) {
        :root {
          --rail: 0px;
        }
        .rail {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 30;
          flex-direction: row;
          width: auto;
          height: 46px;
          padding: 0 6px;
          border-right: 0;
          border-top: 1px solid var(--border);
          overflow-x: auto;
          align-items: center;
        }
        .rail button {
          width: 38px;
          height: 38px;
          margin: 0;
          flex: 0 0 38px;
        }
        .rail .sep {
          width: 1px;
          height: 20px;
          margin: 0 4px;
          flex: 0 0 1px;
        }
        #chart-wrap {
          padding-bottom: 46px;
        }
        .tb,
        select.tb {
          height: 34px;
        }
        .hide-sm {
          display: none;
        }
        #legend {
          top: 6px;
          left: 8px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <button id="symbol-button" class="tb" type="button" title="Loaded symbol">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <span id="symbol-name">DEMO</span>
          <span id="symbol-change"></span>
        </button>
        <select id="symbol-pick" class="tb" aria-label="Symbol"></select>
        <input
          id="symbol-input"
          class="hide-sm"
          type="text"
          inputmode="text"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          placeholder="Ticker"
        />
        <button id="symbol-load" class="tb hide-sm" type="button">Load</button>

        <span class="divider"></span>
        <span id="timeframes"></span>

        <span class="divider"></span>
        <select id="chart-type" class="tb" aria-label="Chart type"></select>

        <span class="divider"></span>
        <button id="indicator-add" class="tb" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 18l4-8 4 5 4-9 4 6" />
          </svg>
          <span class="hide-sm">Indicators</span>
        </button>
        <select id="indicator-pick" class="tb" aria-label="Indicator"></select>
        <button id="indicator-clear" class="tb hide-sm" type="button">Clear</button>

        <span class="divider"></span>
        <button id="scale-log" class="tb" type="button" aria-pressed="false" title="Logarithmic price scale">log</button>
        <button id="renderer-webgl" class="tb" type="button" aria-pressed="false" title="Render the series on the GPU">GPU</button>
        <select id="layout-pick" class="tb hide-sm" aria-label="Chart layout" title="Chart layout">
          <option value="1">1 chart</option>
          <option value="2h">2 side by side</option>
          <option value="2v">2 stacked</option>
          <option value="4">2 × 2</option>
        </select>
        <button id="sync-crosshair" class="tb hide-sm" type="button" aria-pressed="true"
          title="Sync crosshair across charts">sync</button>
        <button id="chart-settings" class="tb" type="button" title="Chart settings">⚙</button>
        <button id="theme-toggle" class="tb" type="button" title="Light / dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" /></svg>
        </button>
        <button id="reset-workspace" class="tb hide-sm" type="button" title="Reset saved layout">Reset</button>
        <button id="live-toggle" class="tb" type="button" aria-pressed="false" title="Stream simulated ticks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /></svg>
          <span class="hide-sm">Live</span>
        </button>

        <span class="spacer"></span>
        <span id="status"></span>
      </div>

      <div id="body">
        <div class="rail" id="tool-rail" role="toolbar" aria-label="Drawing tools"></div>
        <div id="chart-wrap">
          <div id="toasts" aria-live="polite"></div>
          <div id="legend"></div>
          <div id="panes" data-layout="1">
            <div id="chart" data-pane="0" class="pane active"></div>
          </div>
          <div id="replay" hidden>
            <button id="replay-exit" class="tb" type="button" title="Leave replay">✕</button>
            <button id="replay-back" class="tb" type="button" title="Step back">‹</button>
            <button id="replay-play" class="tb" type="button" title="Play">▶</button>
            <button id="replay-forward" class="tb" type="button" title="Step forward">›</button>
            <select id="replay-speed" class="tb" aria-label="Replay speed">
              <option value="1">1×</option>
              <option value="2">2×</option>
              <option value="5">5×</option>
            </select>
            <input id="replay-scrub" type="range" min="0" max="100" value="60" aria-label="Replay position" />
            <span id="replay-at"></span>
          </div>
          <button id="jump" type="button" title="Jump to the latest bar" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>
    </div>
    <dialog id="search">
      <div class="search-head">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
        <input id="search-input" type="text" placeholder="Search symbol" autocomplete="off"
               spellcheck="false" autocapitalize="characters" />
        <kbd>Esc</kbd>
      </div>
      <ul id="search-results"></ul>
      <div class="search-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>↵</kbd> load</span>
        <span id="search-note"></span>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
