<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e1117'/%3E%3Crect x='3' y='5' width='3' height='7' fill='%232ea043'/%3E%3Crect x='10' y='3' width='3' height='9' fill='%23f85149'/%3E%3C/svg%3E" />
    <title>TDV-Shadow</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1117;
        --chrome: #161b22;
        --text: #c9d1d9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* The plot must never force a page scrollbar — asserted in the visual suite. */
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      /* Chrome outside the plot is DOM. Everything inside #chart is canvas. */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        height: 40px;
        flex: 0 0 40px;
        background: var(--chrome);
        border-bottom: 1px solid #21262d;
      }
      #symbol {
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #hint {
        opacity: 0.55;
        font-size: 12px;
        margin-left: auto;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .group > label {
        opacity: 0.5;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .seg {
        display: inline-flex;
        border: 1px solid #30363d;
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .seg button + button {
        border-left: 1px solid #30363d;
      }
      .seg button[aria-pressed='true'] {
        background: #1f6feb;
        color: #fff;
      }
      .seg button:hover:not([aria-pressed='true']) {
        background: #21262d;
      }
      select,
      .btn {
        appearance: none;
        background: #0d1117;
        color: var(--text);
        border: 1px solid #30363d;
        border-radius: 6px;
        font: inherit;
        font-size: 12px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .btn:hover {
        background: #21262d;
      }
      .btn[aria-pressed='true'] {
        background: #1f6feb;
        border-color: #1f6feb;
        color: #fff;
      }
      #toolbar {
        overflow-x: auto;
        white-space: nowrap;
      }
      #status {
        opacity: 0.75;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      #chart {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span id="symbol">BTCUSD · 1m</span>
        <span class="group">
          <label for="renderer-canvas2d">Renderer</label>
          <span class="seg" id="renderer-seg">
            <button id="renderer-canvas2d" type="button" data-value="canvas2d" aria-pressed="true">
              Canvas2D
            </button>
            <button id="renderer-webgl" type="button" data-value="webgl" aria-pressed="false">
              WebGL
            </button>
          </span>
        </span>
        <span class="group">
          <label for="scale-linear">Scale</label>
          <span class="seg" id="scale-seg">
            <button id="scale-linear" type="button" data-value="linear" aria-pressed="true">
              Linear
            </button>
            <button id="scale-log" type="button" data-value="log" aria-pressed="false">Log</button>
          </span>
        </span>
        <span class="group">
          <label for="chart-type">Type</label>
          <select id="chart-type" title="Index-preserving types only — see the note in main.ts"></select>
        </span>
        <span class="group">
          <label for="indicator-pick">Indicator</label>
          <select id="indicator-pick"></select>
          <button id="indicator-add" type="button" class="btn">Add</button>
          <button id="indicator-clear" type="button" class="btn">Clear</button>
        </span>
        <span class="group">
          <label for="tool-pick">Draw</label>
          <select id="tool-pick"></select>
          <button id="magnet-toggle" type="button" aria-pressed="false" class="btn">Magnet</button>
          <button id="draw-clear" type="button" class="btn">Erase</button>
        </span>
        <span class="group">
          <label for="live-toggle">Live</label>
          <span class="seg">
            <button id="live-toggle" type="button" aria-pressed="false">Off</button>
          </span>
        </span>
        <span id="status"></span>
        <span id="hint">drag to pan · wheel to zoom</span>
      </div>
      <div id="chart"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
