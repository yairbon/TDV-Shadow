<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23131722'/%3E%3Crect x='3' y='5' width='3' height='7' fill='%2326a69a'/%3E%3Crect x='10' y='3' width='3' height='9' fill='%23ef5350'/%3E%3C/svg%3E" />
    <title>TDV-Shadow</title>
    <style>
      /* Palette matches the canvas theme in src/renderer/theme.ts, so the chrome and the
         plot read as one surface rather than two apps stitched together. */
      :root {
        color-scheme: dark;
        --bg: #131722;
        --panel: #1e222d;
        --panel-hover: #2a2e39;
        --border: #2a2e39;
        --text: #d1d4dc;
        --text-dim: #787b86;
        --accent: #2962ff;
        --up: #26a69a;
        --down: #ef5350;
        --rail: 44px;
        --topbar: 42px;
      }
      /* Light theme: the canvas palette flips via src/renderer/theme.ts, so the chrome
         must flip with it or the page reads as two different applications. */
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f8f9fd;
        --panel-hover: #e9ecf2;
        --border: #d6dae0;
        --text: #131722;
        --text-dim: #6b7684;
        --up: #089981;
        --down: #f23645;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---------- top bar ---------- */
      #topbar {
        display: flex;
        align-items: center;
        gap: 2px;
        height: var(--topbar);
        flex: 0 0 var(--topbar);
        padding: 0 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        white-space: nowrap;
      }
      #topbar::-webkit-scrollbar {
        display: none;
      }
      .divider {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 6px;
        flex: 0 0 1px;
      }

      /* Every clickable in the bar shares one shape, the way a real toolbar does. */
      .tb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tb:hover {
        background: var(--panel-hover);
      }
      .tb[aria-pressed='true'] {
        background: var(--panel-hover);
        color: #fff;
      }
      .tb:focus-visible,
      .rail button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .tb svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #symbol-button {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.01em;
        padding-right: 10px;
      }
      #symbol-change {
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .tf {
        min-width: 30px;
        justify-content: center;
        padding: 0 7px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-dim);
      }
      .tf[aria-pressed='true'] {
        color: #fff;
      }
      /* A native select sizes itself to its LONGEST option, so bundling 20 more symbols
         grew this one from 180px to 304px and shoved six controls off the right edge of
         the bar — the layout picker, sync, settings, theme and reset all became
         unreachable at 1440px. The full label still shows in the open dropdown, and it
         stays long because search reads it. */
      #symbol-pick {
        max-width: 190px;
        text-overflow: ellipsis;
      }
      select.tb {
        appearance: none;
        padding-right: 22px;
        background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
          linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
        background-position:
          calc(100% - 12px) 13px,
          calc(100% - 8px) 13px;
        background-size:
          4px 4px,
          4px 4px;
        background-repeat: no-repeat;
      }
      #symbol-input {
        width: 74px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        text-transform: uppercase;
      }
      #symbol-input::placeholder {
        color: var(--text-dim);
        text-transform: none;
      }
      .spacer {
        margin-left: auto;
      }
      #status {
        color: var(--text-dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        padding: 0 8px;
        /* The toolbar scrolls horizontally once its controls exceed the window, and the
           status is the last item in it — so at any width under ~1650px it sat past the
           right edge and was clipped mid-word ("2 drawin"). Sticking it to the
           scrollport's right edge keeps it readable while the controls behind it still
           scroll. `flex: 0 0 auto` because it must never be the thing that shrinks. */
        position: sticky;
        right: 0;
        flex: 0 0 auto;
        background: var(--panel);
        box-shadow: -10px 0 10px -6px var(--panel);
      }

      /* Controls evicted from the bar when it runs out of room. Same widgets, moved —
         see src/ui/toolbarOverflow.ts for why they are moved rather than mirrored. */
      #toolbar-overflow {
        position: absolute;
        top: calc(var(--topbar) + 4px);
        right: 8px;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        min-width: 168px;
        padding: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #toolbar-overflow[hidden] {
        display: none;
      }
      /* In the panel the controls stack, so they stretch and read as a menu rather than
         keeping the shrink-wrapped width they had in a horizontal bar. */
      #toolbar-overflow > * {
        width: 100%;
        justify-content: flex-start;
      }
      #toolbar-overflow #symbol-input {
        width: 100%;
      }
      #toolbar-more[aria-expanded='true'] {
        background: var(--panel-hover);
      }
      /* `.tb` sets `display: inline-flex`, which beats the UA stylesheet's
         `[hidden] { display: none }` — so the overflow button stayed on screen at every
         width even with the attribute set. Any `.tb` can be hidden, so fix the class. */
      .tb[hidden] {
        display: none;
      }

      /* ---------- text prompt ---------- */
      #text-prompt {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 0;
        min-width: 320px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      #text-prompt::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      #text-prompt form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
      }
      .tp-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .tp-label {
        font-size: 12px;
        color: var(--text-dim);
      }
      #tp-input {
        height: 32px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      .tp-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 4px;
      }
      .tp-actions button {
        height: 30px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .tp-confirm {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* ---------- object tree ---------- */
      #object-tree {
        position: absolute;
        top: calc(var(--topbar) + 8px);
        right: 12px;
        z-index: 55;
        width: 300px;
        max-height: 60vh;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      #object-tree[hidden] {
        display: none;
      }
      .ot-head {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      .ot-title {
        font-weight: 600;
        font-size: 13px;
        margin-right: auto;
      }
      .ot-bulk {
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        font-size: 11px;
        padding: 3px 7px;
        cursor: pointer;
      }
      .ot-bulk:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      .ot-close {
        border: 0;
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        cursor: pointer;
        padding: 2px 4px;
      }
      .ot-list {
        list-style: none;
        margin: 0;
        padding: 4px;
        overflow-y: auto;
      }
      .ot-empty {
        padding: 14px 10px;
        color: var(--text-dim);
        font-size: 12px;
        text-align: center;
      }
      .ot-row {
        display: flex;
        align-items: center;
        gap: 2px;
        border-radius: 4px;
      }
      .ot-row:hover {
        background: var(--panel-hover);
      }
      .ot-row.selected {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .ot-name {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 6px;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        text-align: left;
        padding: 6px 6px;
        cursor: pointer;
      }
      .ot-detail {
        color: var(--text-dim);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ot-icon {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
      }
      .ot-icon:hover {
        background: var(--bg);
        color: var(--text);
      }
      /* A hidden or locked object reads as dimmed, so the list is scannable without
         inspecting each icon. */
      .ot-icon[aria-pressed='false'][aria-label='Show'] {
        color: var(--down);
      }
      .ot-icon[aria-pressed='true'][aria-label='Unlock'] {
        color: var(--accent);
      }
      .ot-icon svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- body: left rail + chart ---------- */
      #body {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: var(--rail);
        flex: 0 0 var(--rail);
        padding: 6px 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        scrollbar-width: none;
      }
      .rail::-webkit-scrollbar {
        display: none;
      }
      .rail button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        margin: 0 auto;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
      }
      .rail button:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      .rail button[aria-pressed='true'] {
        background: var(--accent);
        color: #fff;
      }
      .rail svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rail .sep {
        height: 1px;
        background: var(--border);
        margin: 4px 8px;
      }
      /* A slot is one family: the button that arms it, the chevron, and the flyout. */
      .rail-slot {
        position: relative;
        width: 32px;
        margin: 0 auto;
      }
      /* The chevron overlays the button's bottom-right corner. `pointer-events: auto`
         against the button below it is what lets the two targets differ. */
      .rail-more {
        position: absolute;
        right: 2px;
        bottom: 2px;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        cursor: pointer;
      }
      .rail-more::after {
        content: '';
        position: absolute;
        right: 1px;
        bottom: 1px;
        border-left: 4px solid transparent;
        border-bottom: 4px solid var(--text-dim);
      }
      .rail-slot:hover .rail-more::after,
      .rail-slot button[aria-pressed='true'] + .rail-more::after {
        border-bottom-color: var(--text);
      }
      .rail-slot button[aria-pressed='true'] + .rail-more::after {
        border-bottom-color: #fff;
      }
      /* Fixed, and positioned by src/ui/toolRail.ts — the rail is a left column at
         desktop widths and a bottom bar on phones, and one static offset cannot keep the
         menu on screen in both. */
      .rail-menu {
        position: fixed;
        z-index: 40;
        min-width: 190px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
      }
      .rail-menu[hidden] {
        display: none;
      }
      .rail-menu button {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        width: 100%;
        height: 28px;
        padding: 0 8px;
        margin: 0;
        font-size: 12px;
        text-align: left;
        white-space: nowrap;
      }
      .rail-menu svg {
        flex: 0 0 16px;
        width: 16px;
        height: 16px;
      }

      #chart-wrap {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
      }

      /* Legend text over the plot is explicitly allowed chrome (root mandate #1); the
         candles themselves remain canvas-only. */
      /* top/left are set from JS so the legend sits over the ACTIVE pane; these are the
         single-pane defaults, used before the first layout pass. */
      #legend {
        position: absolute;
        top: 8px;
        left: 12px;
        z-index: 20;
        pointer-events: none;
        font-size: 12px;
        line-height: 1.6;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #legend .title {
        font-weight: 600;
        font-size: 13px;
        color: var(--text);
      }
      #legend .muted {
        color: var(--text-dim);
        font-weight: 400;
      }
      #legend .ohlc {
        font-variant-numeric: tabular-nums;
        color: var(--text-dim);
      }
      #legend .ohlc b {
        font-weight: 600;
      }
      #legend .ind {
        font-variant-numeric: tabular-nums;
        color: var(--text-dim);
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }

      /* ---------- jump to latest ---------- */
      #jump {
        position: absolute;
        right: 78px;
        bottom: 40px;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #jump:hover {
        background: var(--panel-hover);
      }
      #jump[hidden] {
        display: none;
      }
      #jump svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- symbol search ---------- */
      #search {
        width: min(520px, 92vw);
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      }
      #search::backdrop {
        background: rgba(0, 0, 0, 0.55);
      }
      .search-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .search-head svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--text-dim);
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      #search-input {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        outline: none;
        text-transform: uppercase;
      }
      #search-input::placeholder {
        color: var(--text-dim);
        text-transform: none;
      }
      kbd {
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text-dim);
        font: inherit;
        font-size: 11px;
      }
      #search-results {
        margin: 0;
        padding: 6px;
        list-style: none;
        max-height: 320px;
        overflow-y: auto;
      }
      #search-results li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      #search-results li[aria-selected='true'] {
        background: var(--panel-hover);
      }
      #search-results .tk {
        font-weight: 700;
        min-width: 62px;
      }
      #search-results .nm {
        color: var(--text-dim);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Matched characters. The default UA `mark` is a yellow block that fights the
         palette, so it becomes weight and colour instead of a highlight slab. */
      #search-results mark {
        background: none;
        color: var(--accent);
        font-weight: 700;
      }
      #search-results li[aria-selected='true'] mark {
        color: inherit;
        text-decoration: underline;
      }
      #search-results .src {
        font-size: 11px;
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
      }
      .search-foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 14px;
        border-top: 1px solid var(--border);
        color: var(--text-dim);
        font-size: 11px;
      }

      /* ---------- legend rows ---------- */
      #legend .row {
        display: flex;
        align-items: center;
        gap: 6px;
        pointer-events: auto;
      }
      #legend .row button {
        border: 0;
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
        padding: 0 2px;
        font-size: 13px;
        line-height: 1;
        opacity: 0;
      }
      #legend .row:hover button {
        opacity: 1;
      }
      #legend .row button:hover {
        color: var(--down);
      }

      /* ---------- settings sheets ---------- */
      dialog.sheet {
        width: min(400px, 92vw);
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 24px 64px rgb(0 0 0 / 60%);
      }
      dialog.sheet::backdrop {
        background: rgb(0 0 0 / 45%);
      }
      dialog.sheet h2 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }
      dialog.sheet h3 {
        margin: 16px 0 8px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }
      dialog.sheet .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      dialog.sheet label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--text-dim);
      }
      dialog.sheet input,
      dialog.sheet select {
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      dialog.sheet input[type='color'] {
        width: 34px;
        padding: 2px;
        cursor: pointer;
      }
      dialog.sheet input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      dialog.sheet .style-row {
        display: grid;
        grid-template-columns: 1fr 34px 64px 96px;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      dialog.sheet .style-row .nm {
        font-size: 12px;
      }
      dialog.sheet .row-end {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      dialog.sheet .tb.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      /* ---------- panes ---------- */
      #panes {
        position: absolute;
        inset: 0;
        display: grid;
        gap: 1px;
        background: var(--border);
      }
      #panes[data-layout='1'] {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      #panes[data-layout='2h'] {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr;
      }
      #panes[data-layout='2v'] {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      #panes[data-layout='4'] {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .pane {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Only shown when there is more than one pane: with a single chart an "active"
         outline is noise, since nothing else could be active. */
      #panes[data-layout='1'] .pane.active::after {
        display: none;
      }
      .pane.active::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 25;
        pointer-events: none;
        border: 1px solid var(--accent);
      }
      /* ---------- replay ---------- */
      #replay {
        position: absolute;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        z-index: 35;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgb(0 0 0 / 45%);
      }
      #replay[hidden] {
        display: none;
      }
      #replay .tb {
        height: 26px;
        padding: 0 8px;
      }
      #replay-scrub {
        width: 220px;
        accent-color: var(--accent);
      }
      #replay-at {
        min-width: 120px;
        color: var(--text-dim);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 820px), (pointer: coarse) {
        #replay {
          bottom: 56px;
        }
        #replay-scrub {
          width: 110px;
        }
        #replay-at {
          display: none;
        }
      }

      /* ---------- toasts ---------- */
      #toasts {
        position: absolute;
        top: 12px;
        right: 88px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }
      .toast {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-left: 3px solid var(--up);
        border-radius: 4px;
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
        box-shadow: 0 6px 18px rgb(0 0 0 / 40%);
      }

      /* ---------- context menu ---------- */
      .ctx {
        position: fixed;
        z-index: 60;
        min-width: 208px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgb(0 0 0 / 45%);
        user-select: none;
      }
      .ctx[hidden] {
        display: none;
      }
      .ctx .row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .ctx .row:hover:not(:disabled),
      .ctx .row:focus-visible {
        background: var(--panel-hover);
        outline: none;
      }
      .ctx .row:disabled {
        color: var(--text-dim);
        cursor: default;
      }
      .ctx .row.danger:hover:not(:disabled) {
        color: var(--down);
      }
      .ctx .tick {
        flex: 0 0 12px;
        color: var(--accent);
        font-size: 11px;
      }
      .ctx .label {
        flex: 1 1 auto;
      }
      .ctx .caret {
        flex: 0 0 auto;
        color: var(--text-dim);
      }
      .ctx .sep {
        height: 1px;
        margin: 4px 6px;
        background: var(--border);
      }

      /* ---------- phones ---------- */
      @media (max-width: 820px), (pointer: coarse) {
        :root {
          --rail: 0px;
        }
        .rail {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: 30;
          flex-direction: row;
          width: auto;
          height: 46px;
          padding: 0 6px;
          border-right: 0;
          border-top: 1px solid var(--border);
          overflow-x: auto;
          align-items: center;
        }
        .rail button {
          width: 38px;
          height: 38px;
          margin: 0;
          flex: 0 0 38px;
        }
        .rail-slot {
          width: 38px;
          margin: 0;
          flex: 0 0 38px;
        }
        /* The rail is a bottom bar here, so a flyout opening to the RIGHT runs off the
           screen for every slot past the first few. It opens upward instead, and is
           right-aligned near the end of the row so the last slot's menu stays on screen. */
        .rail-menu {
          max-height: 60vh;
          overflow-y: auto;
        }
        .rail-menu button {
          height: 34px;
          flex: 0 0 34px;
        }
        .rail .sep {
          width: 1px;
          height: 20px;
          margin: 0 4px;
          flex: 0 0 1px;
        }
        #chart-wrap {
          padding-bottom: 46px;
        }
        .tb,
        select.tb {
          height: 34px;
        }
        .hide-sm {
          display: none;
        }
        #legend {
          top: 6px;
          left: 8px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <button id="symbol-button" class="tb" type="button" title="Loaded symbol">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <span id="symbol-name">DEMO</span>
          <span id="symbol-change"></span>
        </button>
        <select id="symbol-pick" class="tb" aria-label="Symbol"></select>
        <input
          id="symbol-input" data-overflow="2"
          class="hide-sm"
          type="text"
          inputmode="text"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          placeholder="Ticker"
        />
        <button id="symbol-load" data-overflow="3" class="tb hide-sm" type="button">Load</button>

        <span class="divider"></span>
        <span id="timeframes"></span>

        <span class="divider"></span>
        <select id="chart-type" class="tb" aria-label="Chart type"></select>

        <span class="divider"></span>
        <button id="indicator-add" class="tb" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 18l4-8 4 5 4-9 4 6" />
          </svg>
          <span class="hide-sm">Indicators</span>
        </button>
        <select id="indicator-pick" class="tb" aria-label="Indicator"></select>
        <button id="indicator-clear" data-overflow="9" class="tb hide-sm" type="button">Clear</button>

        <select id="compare-pick" class="tb" aria-label="Compare symbol" title="Compare a second symbol"
          data-overflow="6"></select>

        <!-- Shown only while a comparison exists; see syncCompareScaleButton in main.ts. -->
        <button id="compare-scale" class="tb hide-sm" type="button" aria-pressed="false" hidden
          title="Show the comparison on its own price axis" data-overflow="6">±%</button>

        <span class="divider"></span>
        <button id="scale-log" data-overflow="8" class="tb" type="button" aria-pressed="false" title="Logarithmic price scale">log</button>
        <button id="renderer-webgl" data-overflow="7" class="tb" type="button" aria-pressed="false" title="Render the series on the GPU">GPU</button>
        <select id="layout-pick" data-overflow="5" class="tb hide-sm" aria-label="Chart layout" title="Chart layout">
          <option value="1">1 chart</option>
          <option value="2h">2 side by side</option>
          <option value="2v">2 stacked</option>
          <option value="4">2 × 2</option>
        </select>
        <button id="sync-crosshair" data-overflow="4" class="tb hide-sm" type="button" aria-pressed="true"
          title="Sync crosshair across charts">sync</button>
        <select id="saved-layouts" class="tb" aria-label="Saved layouts" title="Saved layouts"
          data-overflow="11"></select>
        <button id="chart-settings" class="tb" type="button" title="Chart settings">⚙</button>
        <button id="theme-toggle" data-overflow="10" class="tb" type="button" title="Light / dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" /></svg>
        </button>
        <button id="reset-workspace" data-overflow="1" class="tb hide-sm" type="button" title="Reset saved layout">Reset</button>
        <button id="live-toggle" class="tb" type="button" aria-pressed="false" data-live-state="off"
                title="Stream live prices">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /></svg>
          <span id="live-label" class="hide-sm">Live</span>
        </button>

        <button id="toolbar-more" class="tb" type="button" hidden aria-expanded="false"
          aria-haspopup="true" aria-label="More controls" title="More controls">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
        </button>

        <span class="spacer"></span>
        <span id="status"></span>
      </div>

      <div id="body">
        <div class="rail" id="tool-rail" role="toolbar" aria-label="Drawing tools"></div>
        <div id="chart-wrap">
          <div id="toasts" aria-live="polite"></div>
          <div id="legend"></div>
          <div id="panes" data-layout="1">
            <div id="chart" data-pane="0" class="pane active"></div>
          </div>
          <div id="replay" hidden>
            <button id="replay-exit" class="tb" type="button" title="Leave replay">✕</button>
            <button id="replay-back" class="tb" type="button" title="Step back">‹</button>
            <button id="replay-play" class="tb" type="button" title="Play">▶</button>
            <button id="replay-forward" class="tb" type="button" title="Step forward">›</button>
            <select id="replay-speed" class="tb" aria-label="Replay speed">
              <option value="1">1×</option>
              <option value="2">2×</option>
              <option value="5">5×</option>
            </select>
            <input id="replay-scrub" type="range" min="0" max="100" value="60" aria-label="Replay position" />
            <span id="replay-at"></span>
          </div>
          <button id="jump" type="button" title="Jump to the latest bar" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="toolbar-overflow" hidden role="group" aria-label="More controls"></div>
    <dialog id="search">
      <div class="search-head">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
        <input id="search-input" type="text" placeholder="Search symbol" autocomplete="off"
               spellcheck="false" autocapitalize="characters" />
        <kbd>Esc</kbd>
      </div>
      <ul id="search-results"></ul>
      <div class="search-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>↵</kbd> load</span>
        <span id="search-note"></span>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
